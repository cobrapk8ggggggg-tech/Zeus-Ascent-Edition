name: Diagnose simulator memory reporting
on:
  workflow_dispatch:
  push:
    branches: [fix/comic-translation-reliability]
    paths: ['tools/comic-memory-probe/**', '.github/workflows/zeus-memory-probe.yml']
permissions:
  contents: read
jobs:
  memory:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: {xcode-version: '26.3'}
      - name: Measure the host API
        run: |
          mkdir -p results
          xcrun clang -O2 tools/comic-memory-probe/main.c -o results/host-memory
          results/host-memory | tee results/host.json
      - name: Boot a simulator
        run: |
          xcrun simctl list devices available -j > results/simulators.json
          python3 .zeus-ci/comic/boot_simulator.py
      - name: Measure the simulator API without overriding a memory guard
        run: |
          xcrun --sdk iphonesimulator clang -O2 -arch arm64 -mios-simulator-version-min=18.1 -isysroot "$(xcrun --sdk iphonesimulator --show-sdk-path)" tools/comic-memory-probe/main.c -o results/simulator-memory
          codesign --force --sign - results/simulator-memory
          xcrun simctl spawn "$COMIC_SIMULATOR" "$PWD/results/simulator-memory" | tee results/simulator.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator-memory-report
          path: results/*.json
