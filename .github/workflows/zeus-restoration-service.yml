name: Lossless cloud restoration
on:
  push:
    branches: [fix/comic-translation-reliability]
    paths: ['Restoration/**', 'ZEUSNext/Resources/comic-models.json', '.github/workflows/zeus-restoration-service.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tensors:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r Cloud/requirements.lock numpy==2.2.6 onnxruntime==1.24.2
      - run: PYTHONPATH=Cloud:Restoration python -m unittest -v test_api test_inference
      - name: Validate deployable restoration image
        run: docker build -f Restoration/Dockerfile -t zeus-restoration:test .
