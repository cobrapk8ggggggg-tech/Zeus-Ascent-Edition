name: Native real-chapter image translation probe
on:
  push:
    branches: [fix/comic-translation-reliability]
    paths: ['tools/comic-corpus/**', '.github/workflows/zeus-comic-corpus.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: zeus-native-corpus-${{ github.ref }}
  cancel-in-progress: true
jobs:
  native:
    runs-on: macos-15
    timeout-minutes: 110
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        language: [en, ja, ko, zh, ar]
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: maxim-lobanov/setup-xcode@v1
        with: {xcode-version: '26.3'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify unchanged production image pipeline
        run: git diff --exit-code 3b1e5d843b3486e57e4f407483b94b9c760bae56 -- ZEUSNext Native/ComicRuntime
      - name: Install build tools
        run: brew install xcodegen ninja cmake
      - name: Download and verify original chapter images
        run: |
          python3 -m pip install pillow==11.3.0
          python3 tools/comic-corpus/prepare.py --language '${{ matrix.language }}' --output "$RUNNER_TEMP/corpus"
      - name: Compile pinned native runtime
        run: bash .zeus-ci/comic/build_runtime.sh iphonesimulator
      - name: Generate isolated corpus test host
        run: |
          cp tools/comic-corpus/NativeCorpusProbe.swift .openminis/Host/NativeComicTranslationTests.swift
          xcrun swiftc -frontend -parse .openminis/Host/NativeComicTranslationTests.swift
          python3 .zeus-ci/project.py
          xcodegen generate --spec zeus-project.json
          mkdir -p results
      - name: Boot an available simulator
        timeout-minutes: 15
        run: python3 .zeus-ci/comic/boot_simulator.py
      - name: Serve verified local source pixels
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 --directory "$RUNNER_TEMP/corpus" > results/fixture.log 2>&1 &
          curl --fail --max-time 5 --retry 10 --retry-connrefused http://127.0.0.1:8765/native-manifest.json > /dev/null
      - name: Execute native OCR, actual translation and pixel rendering
        timeout-minutes: 65
        run: |
          set -o pipefail
          xcodebuild -project ZEUSNext.xcodeproj -scheme ZEUSNext -configuration Release -sdk iphonesimulator -destination "platform=iOS Simulator,id=$COMIC_SIMULATOR" -derivedDataPath "$RUNNER_TEMP/ZeusCorpus" -resultBundlePath results/corpus.xcresult -only-testing:ZEUSNextTests/NativeComicTranslationTests/testRealChapterCorpus -parallel-testing-enabled NO -test-timeouts-enabled YES -default-test-execution-time-allowance 3000 -maximum-test-execution-time-allowance 3300 test ENABLE_TESTABILITY=YES CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=- 2>&1 | tee results/native.log
      - name: Export native image and reading evidence
        if: always()
        run: |
          git rev-parse HEAD > results/source-commit.txt
          if [ -f results/corpus.xcresult/Info.plist ]; then
            xcrun xcresulttool get test-results summary --path results/corpus.xcresult > results/summary.json
            xcrun xcresulttool export attachments --path results/corpus.xcresult --output-path results/screenshots
            python3 tools/comic-corpus/assemble.py results
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: native-corpus-${{ matrix.language }}
          retention-days: 14
          path: |
            results/review
            results/native.log
            results/source-commit.txt
            results/summary.json
            results/fixture.log
